name: Feature request
description: Suggest a new feature or enhancement
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package would this feature belong to?
      options:
        - openapi-zod-ts (core generator)
        - "@codewithagents/openapi-server"
        - "@codewithagents/openapi-react-query"
        - "@codewithagents/openapi-msw"
        - "@codewithagents/api-errors"
        - New package / unsure
    validations:
      required: true

  - type: dropdown
    id: openapi-version
    attributes:
      label: OpenAPI spec version
      description: Which OpenAPI version is this related to (if applicable)?
      options:
        - "3.1.1"
        - "3.1.0"
        - "3.0.x"
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Why does the current behavior not work for you?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why do you prefer the proposed solution?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, links, or examples that might help.
    validations:
      required: false
