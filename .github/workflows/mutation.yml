name: Mutation Testing

# Mutation runs are slow, so they do not gate every PR. They run weekly and on
# demand, and enforce each package's Stryker `thresholds.break` (a score below
# break fails the job). This is the real "mutation testing across all four
# packages" gate.
on:
  schedule:
    - cron: '0 5 * * 1' # Weekly Monday 5am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - openapi-zod-ts
          - '@codewithagents/openapi-react-query'
          - '@codewithagents/openapi-server'
          - '@codewithagents/api-errors'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Mutation test (enforces thresholds.break)
        run: pnpm --filter ${{ matrix.package }} run test:mutation
