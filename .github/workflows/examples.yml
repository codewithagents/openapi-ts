name: Showcase

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/openapi-zod-ts/**'
      - 'packages/openapi-react-query/**'
      - 'packages/openapi-server/**'
      - 'packages/openapi-msw/**'
      - 'examples/**'
  push:
    branches: [main]
    paths:
      - 'packages/openapi-zod-ts/**'
      - 'packages/openapi-react-query/**'
      - 'packages/openapi-server/**'
      - 'packages/openapi-msw/**'
      - 'examples/**'
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC — catch upstream API spec drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase:
    name: Showcase (Drift + Typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Regenerate showcase specs
        run: pnpm --filter @codewithagents/examples run generate

      - name: Verify showcase output is up to date
        run: |
          git diff --exit-code examples/generated/ examples/generated-rq/ || (
            echo ""
            echo "Showcase generated output is out of date."
            echo "Run 'pnpm generate' in examples/ and commit the result."
            exit 1
          )

      - name: Typecheck showcase output
        run: pnpm --filter @codewithagents/examples run typecheck

      - name: Fallow — circular-dep check on generated output
        run: |
          pnpm exec fallow dead-code --circular-deps \
            --format annotations \
          || true
        working-directory: examples/generated

  compat-matrix:
    name: Compatibility Matrix (128 specs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The per-generator compat matrices (generate all 128 specs, typecheck the client
      # matrix). Carved out of the required ci job; runs here, path-filtered to generator
      # and example changes only.
      - run: pnpm test:matrix
