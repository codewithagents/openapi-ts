name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_openapi_zod_ts:
        description: 'Re-publish openapi-zod-ts (for failed release recovery)'
        type: boolean
        default: false
      publish_api_errors:
        description: 'Re-publish @codewithagents/api-errors (for failed release recovery)'
        type: boolean
        default: false
      publish_openapi_react_query:
        description: 'Re-publish @codewithagents/openapi-react-query (for failed release recovery)'
        type: boolean
        default: false
      publish_openapi_server:
        description: 'Re-publish @codewithagents/openapi-server (for failed release recovery)'
        type: boolean
        default: false
      publish_openapi_msw:
        description: 'Re-publish @codewithagents/openapi-msw (for failed release recovery)'
        type: boolean
        default: false

permissions:
  contents: write # create tags and releases
  pull-requests: write # create and update release PRs

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      api-errors--release_created: ${{ steps.release.outputs['packages/api-errors--release_created'] }}
      api-errors--version: ${{ steps.release.outputs['packages/api-errors--version'] }}
      openapi-zod-ts--release_created: ${{ steps.release.outputs['packages/openapi-zod-ts--release_created'] }}
      openapi-zod-ts--version: ${{ steps.release.outputs['packages/openapi-zod-ts--version'] }}
      openapi-react-query--release_created: ${{ steps.release.outputs['packages/openapi-react-query--release_created'] }}
      openapi-react-query--version: ${{ steps.release.outputs['packages/openapi-react-query--version'] }}
      openapi-server--release_created: ${{ steps.release.outputs['packages/openapi-server--release_created'] }}
      openapi-server--version: ${{ steps.release.outputs['packages/openapi-server--version'] }}
      openapi-msw--release_created: ${{ steps.release.outputs['packages/openapi-msw--release_created'] }}
      openapi-msw--version: ${{ steps.release.outputs['packages/openapi-msw--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-api-errors:
    name: Publish @codewithagents/api-errors
    needs: release-please
    if: ${{ needs.release-please.outputs['api-errors--release_created'] || inputs.publish_api_errors }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Node 22 ships with npm 10.x which does not implement OIDC Trusted Publishing auth.
      # npm 11.x added native OIDC auth support — upgrade before publishing.
      # OIDC Trusted Publishing auth requires npm 11.5.1+. Node 22 ships with
      # npm 10.x — upgrade to latest to guarantee the minimum version.
      - name: Upgrade npm to latest (OIDC Trusted Publishing requires ≥11.5.1)
        run: npm install -g npm@latest
      # setup-node injects NODE_AUTH_TOKEN=$GITHUB_TOKEN into .npmrc, which blocks
      # OIDC Trusted Publishing. Remove it so npm falls back to OIDC token exchange.
      - name: Remove injected auth token (npm will use OIDC Trusted Publishing)
        run: npm config delete //registry.npmjs.org/:_authToken
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # --provenance adds supply-chain attestation and triggers OIDC auth exchange.
      # Use npm (not pnpm) — only npm CLI implements the Trusted Publishing flow.
      - run: npm publish --access public --provenance
        working-directory: packages/api-errors

  publish-openapi-zod-ts:
    name: Publish openapi-zod-ts
    needs: release-please
    if: ${{ needs.release-please.outputs['openapi-zod-ts--release_created'] || inputs.publish_openapi_zod_ts }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Node 22 ships with npm 10.x which does not implement OIDC Trusted Publishing auth.
      # npm 11.x added native OIDC auth support — upgrade before publishing.
      # OIDC Trusted Publishing auth requires npm 11.5.1+. Node 22 ships with
      # npm 10.x — upgrade to latest to guarantee the minimum version.
      - name: Upgrade npm to latest (OIDC Trusted Publishing requires ≥11.5.1)
        run: npm install -g npm@latest
      # setup-node injects NODE_AUTH_TOKEN=$GITHUB_TOKEN into .npmrc, which blocks
      # OIDC Trusted Publishing. Remove it so npm falls back to OIDC token exchange.
      - name: Remove injected auth token (npm will use OIDC Trusted Publishing)
        run: npm config delete //registry.npmjs.org/:_authToken
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openapi-zod-ts build
      # pnpm pack resolves catalog: and workspace:* references to actual version ranges
      # before creating the tarball. npm publish then publishes the pre-packed tarball
      # with OIDC Trusted Publishing auth. Using npm publish directly leaves catalog:
      # unresolved in the published package.json, causing EUNSUPPORTEDPROTOCOL for consumers.
      - run: pnpm pack
        working-directory: packages/openapi-zod-ts
      - run: npm publish --access public --provenance *.tgz
        working-directory: packages/openapi-zod-ts

  publish-openapi-react-query:
    name: Publish @codewithagents/openapi-react-query
    needs: release-please
    if: ${{ needs.release-please.outputs['openapi-react-query--release_created'] || inputs.publish_openapi_react_query }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Node 22 ships with npm 10.x which does not implement OIDC Trusted Publishing auth.
      # npm 11.x added native OIDC auth support — upgrade before publishing.
      # OIDC Trusted Publishing auth requires npm 11.5.1+. Node 22 ships with
      # npm 10.x — upgrade to latest to guarantee the minimum version.
      - name: Upgrade npm to latest (OIDC Trusted Publishing requires ≥11.5.1)
        run: npm install -g npm@latest
      # setup-node injects NODE_AUTH_TOKEN=$GITHUB_TOKEN into .npmrc, which blocks
      # OIDC Trusted Publishing. Remove it so npm falls back to OIDC token exchange.
      - name: Remove injected auth token (npm will use OIDC Trusted Publishing)
        run: npm config delete //registry.npmjs.org/:_authToken
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openapi-zod-ts build
      - run: pnpm --filter @codewithagents/openapi-react-query build
      # pnpm pack resolves workspace:* references to actual versions before creating the tarball.
      # npm publish then publishes that pre-packed tarball with OIDC Trusted Publishing auth.
      # Using npm publish directly (without pnpm pack first) leaves workspace:* unresolved in
      # the published package.json, causing EUNSUPPORTEDPROTOCOL errors for consumers.
      - run: pnpm pack
        working-directory: packages/openapi-react-query
      - run: npm publish --access public --provenance *.tgz
        working-directory: packages/openapi-react-query

  publish-openapi-server:
    name: Publish @codewithagents/openapi-server
    needs: release-please
    if: ${{ needs.release-please.outputs['openapi-server--release_created'] || inputs.publish_openapi_server }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm to latest (OIDC Trusted Publishing requires ≥11.5.1)
        run: npm install -g npm@latest
      - name: Remove injected auth token (npm will use OIDC Trusted Publishing)
        run: npm config delete //registry.npmjs.org/:_authToken
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openapi-zod-ts build
      - run: pnpm --filter @codewithagents/openapi-server build
      # pnpm pack resolves workspace:* references to actual versions before creating the tarball.
      - run: pnpm pack
        working-directory: packages/openapi-server
      - run: npm publish --access public --provenance *.tgz
        working-directory: packages/openapi-server

  publish-openapi-msw:
    name: Publish @codewithagents/openapi-msw
    needs: release-please
    if: ${{ needs.release-please.outputs['openapi-msw--release_created'] || inputs.publish_openapi_msw }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm to latest (OIDC Trusted Publishing requires ≥11.5.1)
        run: npm install -g npm@latest
      - name: Remove injected auth token (npm will use OIDC Trusted Publishing)
        run: npm config delete //registry.npmjs.org/:_authToken
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openapi-zod-ts build
      - run: pnpm --filter @codewithagents/openapi-msw build
      # pnpm pack resolves workspace:* references to actual versions before creating the tarball.
      # npm publish then publishes that pre-packed tarball with OIDC Trusted Publishing auth.
      # Using npm publish directly (without pnpm pack first) leaves workspace:* unresolved in
      # the published package.json, causing EUNSUPPORTEDPROTOCOL errors for consumers.
      - run: pnpm pack
        working-directory: packages/openapi-msw
      - run: npm publish --access public --provenance *.tgz
        working-directory: packages/openapi-msw
