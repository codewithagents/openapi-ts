name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal permissions: fork PRs have no secrets access by design with pull_request trigger
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Change detection: classify the PR as code-touching vs docs-only.
  # Tier 2 (heavy / browser) jobs gate on the `code` output so docs-only PRs
  # skip them entirely. Tier 1 (Build, Lint & Test) and the CI Gate always run.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads PR file list via the API on pull_request
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # `code` is true when ANY changed path is NOT docs-only. The `!` predicates
          # subtract the docs surface (docs/**, every *.md and *.mdx anywhere) so a PR
          # that touches only documentation yields code=false and skips all Tier 2 jobs.
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.mdx'

  # ===========================================================================
  # TIER 1: always runs (the fast floor + primary required check).
  # ===========================================================================
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      # Unit tests only. The 128-spec compat matrix is carved out (test:matrix) and runs
      # in the path-filtered Showcase workflow, off the required merge path.
      - run: pnpm test

  # ===========================================================================
  # TIER 2: heavy / browser jobs. Each needs the change detector and only runs
  # when changes.outputs.code == 'true' (skipped on docs-only PRs).
  # ===========================================================================
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # All package coverage in parallel (matrix excluded, same as the unit-test run).
      # This runs alongside the ci job so coverage is off the fast gate's critical path.
      - run: pnpm test:coverage

      - name: Upload coverage to Codecov (api-errors)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          use_oidc: true
          files: ./packages/api-errors/coverage/lcov.info
          flags: api-errors
          disable_search: true # prevent auto-discovery of other packages' lcov files
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (openapi-zod-ts)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          use_oidc: true
          files: ./packages/openapi-zod-ts/coverage/lcov.info
          flags: openapi-zod-ts
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (openapi-react-query)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          use_oidc: true
          files: ./packages/openapi-react-query/coverage/lcov.info
          flags: openapi-react-query
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (openapi-server)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          use_oidc: true
          files: ./packages/openapi-server/coverage/lcov.info
          flags: openapi-server
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (openapi-msw)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          use_oidc: true
          files: ./packages/openapi-msw/coverage/lcov.info
          flags: openapi-msw
          disable_search: true
          fail_ci_if_error: false

  typecheck-generated:
    name: Typecheck Generated Output
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Regenerate all gitignored generated dirs, then typecheck every generated surface:
      # petstore-fastify (generated + generated-auth), petstore-express (generated),
      # integration/generated, examples/generated*.
      # petstore-hono is intentionally not wired in yet: typechecking its generated
      # output surfaces two real generator type bugs (octet-stream Uint8Array vs BodyInit,
      # and a readOnly/writeOnly nested-variant return type) that get fixed in their own
      # PR, which then adds petstore-hono here.
      - run: pnpm typecheck:generated

  server-examples:
    name: Server Examples (Fastify + Express)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # petstore-fastify: generate (via typecheck/test scripts), typecheck server output, run inject suite
      - run: pnpm --filter petstore-fastify run typecheck
      - run: pnpm --filter petstore-fastify run test
      # petstore-express: generate, typecheck server output, run routes suite
      - run: pnpm --filter petstore-express run typecheck
      - run: pnpm --filter petstore-express run test

  e2e:
    name: E2E (Petstore)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/petstore-hono
      # Generated code is not committed. test:e2e runs `pnpm generate` first, which
      # rebuilds generated/ from spec/api.json using the workspace generators built above.
      - name: Run E2E tests
        run: pnpm --filter @codewithagents/petstore-hono run test:e2e

  e2e-fastify:
    name: E2E (Petstore Fastify)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # request-API only: tests use Playwright's APIRequestContext over a real socket,
      # so no browser binaries are installed. test:e2e runs `pnpm generate` first.
      - name: Run Fastify E2E tests
        run: pnpm --filter petstore-fastify run test:e2e

  e2e-fastify-fullstack:
    name: E2E (Petstore Fastify Fullstack)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The canonical full-stack reference: a real Chromium drives the React app, which
      # logs in and round-trips a cross-field validation error onto the form. test:e2e:auth
      # runs `pnpm build` (generate + vite build) first.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/petstore-fastify
      - name: Run Fastify fullstack E2E (login + cross-field round-trip)
        run: pnpm --filter petstore-fastify run test:e2e:auth

  e2e-contract:
    name: Contract (uniform real-HTTP across fastify/hono/express)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # request-only: boots each framework (fastify, hono, express) on an ephemeral socket
      # and hits it with raw global fetch. No browser binaries. `test` runs generate:deps first.
      - name: Run uniform contract suite
        run: pnpm --filter @codewithagents/petstore-contract run test

  # ===========================================================================
  # GATE AGGREGATOR: the single stable required status check for Tier 2.
  # Always runs (if: always()) so it reports even when every Tier 2 job is
  # skipped on a docs-only PR. Passes when every needed job is success OR
  # skipped; fails if any is failure OR cancelled.
  # ===========================================================================
  gate:
    name: CI Gate
    needs:
      - changes
      - coverage
      - typecheck-generated
      - server-examples
      - e2e
      - e2e-fastify
      - e2e-fastify-fullstack
      - e2e-contract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Tier 2 jobs passed or were skipped
        env:
          # toJSON(needs) is a map of job-id to { "result": "...", "outputs": {...} }.
          # result is one of: success, failure, cancelled, skipped.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Needed job results:"
          echo "$RESULTS"
          # Fail closed if the needs map is somehow empty or null.
          if [ -z "$RESULTS" ] || [ "$RESULTS" = "null" ]; then
            echo "::error::CI Gate failed: needs results were empty or null."
            exit 1
          fi
          # Fail the gate if ANY needed job is failure or cancelled.
          # success and skipped both pass (skipped = docs-only PR, gated off).
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI Gate failed, the following needed jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "CI Gate passed: every needed job was success or skipped."
