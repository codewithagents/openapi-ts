name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal permissions — fork PRs have no secrets access by design with pull_request trigger
permissions:
  contents: read

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      # Unit tests only. The 128-spec compat matrix is carved out (test:matrix) and runs
      # in the path-filtered Showcase workflow, off the required merge path.
      - run: pnpm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # All package coverage in parallel (matrix excluded, same as the unit-test run).
      # This runs alongside the ci job so coverage is off the fast gate's critical path.
      - run: pnpm test:coverage

      - name: Upload coverage to Codecov (api-errors)
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          use_oidc: true
          files: ./packages/api-errors/coverage/lcov.info
          flags: api-errors
          disable_search: true # prevent auto-discovery of other packages' lcov files
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (openapi-zod-ts)
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          use_oidc: true
          files: ./packages/openapi-zod-ts/coverage/lcov.info
          flags: openapi-zod-ts
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (openapi-react-query)
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          use_oidc: true
          files: ./packages/openapi-react-query/coverage/lcov.info
          flags: openapi-react-query
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (openapi-server)
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          use_oidc: true
          files: ./packages/openapi-server/coverage/lcov.info
          flags: openapi-server
          disable_search: true
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (openapi-msw)
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          use_oidc: true
          files: ./packages/openapi-msw/coverage/lcov.info
          flags: openapi-msw
          disable_search: true
          fail_ci_if_error: false

  typecheck-generated:
    name: Typecheck Generated Output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Regenerate all gitignored generated dirs, then typecheck every generated surface:
      # petstore-fastify (generated + generated-auth), petstore-express (generated),
      # integration/generated, examples/generated*.
      # petstore-hono is intentionally not wired in yet: typechecking its generated
      # output surfaces two real generator type bugs (octet-stream Uint8Array vs BodyInit,
      # and a readOnly/writeOnly nested-variant return type) that get fixed in their own
      # PR, which then adds petstore-hono here.
      - run: pnpm typecheck:generated

  server-examples:
    name: Server Examples (Fastify + Express)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # petstore-fastify: generate (via typecheck/test scripts), typecheck server output, run inject suite
      - run: pnpm --filter petstore-fastify run typecheck
      - run: pnpm --filter petstore-fastify run test
      # petstore-express: generate, typecheck server output, run routes suite
      - run: pnpm --filter petstore-express run typecheck
      - run: pnpm --filter petstore-express run test

  e2e:
    name: E2E (Petstore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/petstore-hono
      # Generated code is not committed. test:e2e runs `pnpm generate` first, which
      # rebuilds generated/ from spec/api.json using the workspace generators built above.
      - name: Run E2E tests
        run: pnpm --filter @codewithagents/petstore-hono run test:e2e

  e2e-fastify:
    name: E2E (Petstore Fastify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # request-API only: tests use Playwright's APIRequestContext over a real socket,
      # so no browser binaries are installed. test:e2e runs `pnpm generate` first.
      - name: Run Fastify E2E tests
        run: pnpm --filter petstore-fastify run test:e2e

  e2e-fastify-fullstack:
    name: E2E (Petstore Fastify Fullstack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The canonical full-stack reference: a real Chromium drives the React app, which
      # logs in and round-trips a cross-field validation error onto the form. test:e2e:auth
      # runs `pnpm build` (generate + vite build) first.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/petstore-fastify
      - name: Run Fastify fullstack E2E (login + cross-field round-trip)
        run: pnpm --filter petstore-fastify run test:e2e:auth
