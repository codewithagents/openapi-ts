openapi: "3.1.0"
info:
  title: Petstore
  version: "1.0.0"

paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      parameters:
        - name: species
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /pets/{id}:
    get:
      operationId: getPet
      summary: Get a pet by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Not found

components:
  schemas:
    Pet:
      type: object
      required: [id, name, species, status]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 64
        species:
          type: string
        status:
          type: string
          enum: [available, adopted]

    CreatePetRequest:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        species:
          type: string
