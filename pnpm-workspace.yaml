packages:
  - 'packages/*'
  - 'examples'
  - 'docs'

catalog:
  # Test tooling — used across all packages
  vitest: ^5.0.0
  '@vitest/coverage-v8': ^5.0.0

  # TypeScript
  typescript: ^7.0.2

  # Node types
  '@types/node': ^26.0.0

  # OpenAPI
  openapi-types: ^12.1.3

  # Property-based testing
  fast-check: ^4.8.0

  # Formatter
  prettier: ^3.9.4

  # Bundler (CLI packages)
  esbuild: ^0.28.1

  # Mutation testing
  '@stryker-mutator/core': ^10.0.0
  '@stryker-mutator/vitest-runner': ^10.0.0

  # ESLint (integration lint)
  eslint: ^10.5.0
  '@typescript-eslint/eslint-plugin': ^8.61.1
  '@typescript-eslint/parser': ^8.61.1

  # Zod (examples)
  zod: ^4.4.3

  # React ecosystem (integration + petstore)
  react: ^19.2.7
  react-dom: ^19.2.7
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@tanstack/react-query': ^5.101.0
